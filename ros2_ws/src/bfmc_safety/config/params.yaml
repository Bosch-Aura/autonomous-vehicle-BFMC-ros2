# Parámetros de bfmc_safety. Toda constante del nodo vive acá, no en el código.
# La clave de primer nivel es el nombre del nodo.
# Los valores marcados [asumido] son una primera propuesta y se ajustan en el auto.
safety:
  ros__parameters:
    ultrasonic_topic: /hardware/ultrasonic   # topic del que lee (sensor_msgs/Range)
    status_topic: /safety/status             # topic en el que publica
    frame_id: ultrasonic_front               # frame del encabezado del estado
    publish_rate_hz: 20.0                    # [Hz] el estado se publica a frecuencia fija

    stop_distance_m: 0.30       # [m] por debajo de esto hay emergencia [asumido]
    resume_distance_m: 0.40     # [m] por encima de esto se libera; debe ser mayor que la anterior [asumido]
    stale_timeout_s: 0.3        # [s] sin lecturas por más tiempo que esto hay emergencia [asumido]

    # Una lectura NaN es un error del sensor. Una lectura sin eco NO es un error: es
    # camino despejado y se interpreta como tal (ver la lógica).
    emergency_on_invalid: true
