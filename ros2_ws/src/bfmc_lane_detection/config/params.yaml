# Parámetros de bfmc_lane_detection. Toda constante del nodo vive acá, no en el código.
# La clave de primer nivel es el nombre del nodo.
# TODOS los valores de visión y de geometría son una primera propuesta [asumido]:
# dependen de la cámara, de su montaje y de la iluminación, y se calibran con
# imágenes reales de la pista.
lane_detection:
  ros__parameters:
    image_topic: /camera/color/image_raw
    lane_topic: /perception/lane
    # Imágenes de depuración: qué ve el detector. Solo se calculan si alguien está suscripto.
    debug_overlay_topic: /perception/lane_debug/overlay      # cámara con lo detectado encima
    debug_birdview_topic: /perception/lane_debug/birdview    # vista desde arriba con ventanas y curvas

    # 1. Umbral de color de las marcas blancas, en HSV de OpenCV (H 0-179, S y V 0-255).
    white_hsv_min: [0, 0, 200]       # [H, S, V] mínimos
    white_hsv_max: [179, 60, 255]    # [H, S, V] máximos
    morph_kernel_px: 3               # [px] apertura morfológica que quita el ruido; 1 = sin apertura

    # 2. Región de interés: se descarta esta fracción de arriba de la imagen. Tiene que quedar
    # por encima del trapecio (su borde lejano); si no, tapa la parte lejana de la vista.
    roi_top_fraction: 0.3            # [asumido]

    # 3. Vista cenital. El trapecio de la imagen (warp_src) y la escala NO se cargan: el nodo
    # los calcula con la pose de la cámara, sus intrínsecos y el rectángulo del piso que se
    # quiere ver (más abajo, "Geometría"). Así la escala no se puede desatar del trapecio.
    warp_width: 400                  # [px] tamaño de la vista cenital
    warp_height: 400                 # [px]

    # Dato de la pista (no de la cámara): no cambia la escala. Lo usan el chequeo de
    # separación entre líneas y el modo "una sola línea".
    lane_width_m: 0.37               # [m] centro a centro de las dos líneas, en una recta [asumido: medir con cinta]

    # 4. Búsqueda de las líneas con ventanas deslizantes.
    n_windows: 9                     # cantidad de ventanas, de abajo hacia arriba
    window_margin_px: 40             # [px] mitad del ancho de cada ventana
    min_pixels: 50                   # píxeles mínimos para dar por válida una línea

    # 4b. Chequeos de cada medición (A2-152). Una línea que no los pasa se descarta.
    # Valores iniciales permisivos [asumido: afinar en pista con el protocolo de zonas].
    min_windows: 3                   # ventanas con píxeles que necesita una línea (de n_windows)
    max_residual_m: 0.02             # [m] error medio del polinomio respecto de los píxeles
    min_curve_radius_m: 0.4          # [m] radio de la curva más cerrada de la pista [asumido: medir]
    # Las dos líneas tienen que estar a lane_width_m ± esto, medido perpendicular a ellas.
    lane_width_tolerance_m: 0.05     # [m]
    width_check_fractions: [0.1, 0.5, 0.9]   # alturas donde se mide el ancho (0 = cerca, 1 = lejos)

    # 4d. Búsqueda alrededor del polinomio del cuadro anterior (A2-153): solo se toman los
    # píxeles a menos de esta distancia de él. Sin previo, o si lo encontrado no pasa los
    # chequeos, se buscan las ventanas deslizantes. El previo se olvida con lost_timeout_s.
    search_margin_m: 0.05            # [m] [asumido: afinar en pista]

    # 4e. Filtro de Kalman del carril (A2-154): estado [desvío, rumbo, curvatura] en la fila
    # de medición. Predice con el avance del auto y corrige con cada medición.
    # Apagado hasta medir R y Q en la pista y coordinar con bfmc_control (con el filtro
    # activo conviene filter_alpha: 1.0 allá, para no filtrar dos veces).
    kalman_enabled: false
    cmd_drive_topic: /cmd/drive      # velocidad del auto para predecir: la comandada (no hay odometría)
    # Varianzas [desvío m², rumbo rad², curvatura (1/m)²]. Todas [asumido]. Cómo medirlas:
    # R: con el auto quieto en una recta, varianza de lo medido durante unos segundos (repetir
    #    en una curva). Q: arrancar chico y subir hasta que en el visor el filtrado siga las
    #    curvas sin atrasarse.
    kalman_q: [0.0004, 0.01, 0.25]               # por segundo
    kalman_r_two_lines: [0.0001, 0.0025, 0.25]   # ~1 cm, 0,05 rad, 0,5 1/m de desvío estándar
    kalman_r_one_line: [0.0004, 0.01, 1.0]       # con una línea pesa menos (el doble de desvío)
    kalman_gate_chi2: 11.34          # descarta mediciones fuera del 99 % (chi-cuadrado, 3 grados de libertad)
    kalman_max_std_m: 0.1            # [m] incertidumbre del desvío con la que la confianza llega a 0

    # 4c. Fallback: sin líneas válidas se repite el último estado (MODE_PREDICTED) con la
    # confianza bajando hasta 0; pasado este tiempo, MODE_LOST y bfmc_decision frena.
    lost_timeout_s: 0.3              # [s] a 0,3 m/s son unos 9 cm a ciegas [asumido]

    # 5. Medición.
    reference_row_fraction: 0.25     # fila donde se mide, como fracción hacia adelante (0 = pegado al auto)
    full_confidence_pixels: 1500     # píxeles de línea con los que la confianza llega a 1

    # Intersección: una franja horizontal blanca que cruza la vista cenital.
    intersection_band_top_fraction: 0.5   # solo se mira la mitad cercana al auto
    intersection_row_fraction: 0.6        # una fila cuenta si está blanca en al menos esta fracción
    intersection_min_rows: 8              # filas necesarias para dar la intersección por detectada

    # Geometría de la vista cenital. De acá salen warp_src y la escala.
    # Pose de la cámara: la mide la calibración [sin calibrar: valores de una cámara nominal].
    calib_height_m: 0.200            # [m] altura del centro óptico sobre el piso
    calib_pitch_deg: 20.0            # [°] inclinación hacia abajo
    calib_roll_deg: 0.0              # [°] giro alrededor del eje óptico; + = lado derecho más alto
    # Intrínsecos del color (los de su camera_info): fx, fy, cx, cy, ancho, alto. Los copia la
    # calibración [sin calibrar: valores típicos de la D435 a 640 x 480].
    camera_intrinsics: [615.0, 615.0, 320.0, 240.0, 640.0, 480.0]
    # Rectángulo del piso que muestra la vista cenital, medido desde el pie de la cámara.
    calib_forward_near_m: 0.45       # [m] borde de abajo de la vista cenital
    calib_forward_far_m: 0.95        # [m] borde de arriba
    calib_half_width_m: 0.25         # [m] mitad del ancho

    # Calibración con la profundidad de la D435 (ver README, "Cómo calibrarlo"). Con el auto
    # quieto y la zona despejada: ros2 service call /lane_detection/calibrate_ground std_srvs/srv/Trigger
    # Mide la pose y los intrínsecos y los aplica en vivo; para que queden, Guardar.
    calibrate_service: ~/calibrate_ground
    depth_topic: /camera/aligned_depth_to_color/image_raw      # alineada al color (align_depth en bfmc_camera)
    depth_info_topic: /camera/aligned_depth_to_color/camera_info
    calib_frames: 10                 # cuadros que se promedian por píxel para bajar el ruido
    calib_timeout_s: 5.0             # [s] espera máxima de esos cuadros (el visor espera 20 s)
    # Puntos candidatos a piso: mitad de abajo de la imagen, con profundidad en este rango.
    calib_depth_min_m: 0.3           # [m]
    calib_depth_max_m: 1.5           # [m]
    calib_subsample: 4               # se usa 1 de cada N píxeles en cada dirección
    calib_min_points: 500            # menos puntos válidos que esto: el piso no se ve
    # Plano con RANSAC.
    calib_ransac_iters: 200
    calib_ransac_seed: 0             # semilla fija: el mismo cuadro da siempre el mismo resultado
    calib_inlier_m: 0.01             # [m] distancia al plano para contar como piso
    calib_min_inlier_fraction: 0.6   # menos que esto: hay algo delante de la cámara
    calib_height_range_m: [0.05, 0.50]      # [m] alturas de cámara con sentido
    calib_pitch_range_deg: [0.0, 60.0]      # [°] inclinaciones con sentido; descarta una pared tomada por piso
    # Chequeo al arrancar: si la cámara se movió desde la última calibración, avisa (no corrige).
    calib_check_on_start: true
    calib_check_frames: 3            # compara contra calib_height_m y calib_pitch_deg
    calib_check_height_tol_m: 0.01   # [m]
    calib_check_pitch_tol_deg: 1.0   # [°]

    # Con el auto andando (ESP32 en RUNNING) se rechazan la calibración y los cambios de
    # geometría. Sin estado del ESP32 (sin el puente), el auto no se mueve y se permiten.
    hardware_status_topic: /hardware/status

    # Guardar: escribe las medidas (lane_width_m), la geometría y los ajustes de color y región
    # en este archivo, FUERA del repo. Los launch lo cargan después de este params.yaml, así
    # le gana. Para volver a los valores del repo, borralo.
    save_service: ~/save_params
    persist_file: ~/.config/bfmc/lane_detection.yaml

    # Depuración: se puede apagar con publish_debug: false y se limita a debug_max_fps imágenes
    # por segundo para no gastar CPU. Todos los parámetros de la visión de arriba (menos los
    # topics) se pueden cambiar con el nodo andando, por ejemplo con `ros2 param set` o desde el
    # visor de calibración; el cambio no se guarda en este archivo.
    publish_debug: true
    debug_max_fps: 10.0              # [Hz]
