# Parámetros de bfmc_control. Toda constante del nodo vive acá, no en el código.
# La clave de primer nivel es el nombre del nodo.
# Los valores marcados [asumido] son una primera propuesta y se afinan en el auto.
control:
  ros__parameters:
    lane_topic: /perception/lane       # topic del que lee el estado del carril
    cmd_topic: /control/lane_cmd       # topic en el que publica el comando
    frame_id: base_link                # frame del encabezado del comando

    # PID sobre el error = desvío lateral + heading_weight * error de rumbo.
    kp: 1.5                            # [rad/m] [asumido]
    ki: 0.1                            # [rad/(m*s)] [asumido]
    kd: 0.05                           # [rad*s/m] baja de 0,2: derivaba el ruido de cada cuadro y el volante vibraba en recta [asumido: afinar en pista]
    heading_weight_m_per_rad: 0.5      # [m/rad] cuánto pesa el rumbo frente al desvío [asumido]
    deadband_m: 0.03                   # [m] errores menores se ignoran; sube de 0,01 para no corregir constantemente en recta [asumido: afinar en pista]
    integral_limit_rad: 0.15           # [rad] tope del término integral (anti-windup) [asumido]

    # Forma de la salida.
    max_steer_rad: 0.436332            # [rad] 25 grados, el tope del servo según el informe (igual que en bfmc_hardware_bridge) [por-verificar: medir]
    max_steer_rate_rad_s: 3.0          # [rad/s] límite de velocidad de giro [asumido]
    filter_alpha: 0.35                 # (0, 1] 1 = sin filtro; menor = más suave; baja de 0,6 [asumido: afinar en pista]

    # Velocidad.
    cruise_speed_mps: 0.3              # [m/s] velocidad de crucero [asumido]
    # [0, 1) cuánto baja la velocidad al girar al máximo. En 0: con 0,4 el auto pedía 0,18 m/s
    # (duty 181) con las ruedas giradas y el motor no lo movía; se clavaba en las curvas
    # (2026-11-08). A 0,3 m/s no hace falta frenar en curva. Volver a subirlo solo con un piso
    # de duty medido que mueva el auto con las ruedas al tope.
    slowdown_gain: 0.0

    # Carril no detectado o poco confiable.
    min_confidence: 0.15               # [0, 1] debajo de esto se trata como carril perdido y se endereza. Bajo para que,
                                       # mientras lane_detection predice (lost_timeout_s, 1 s), se siga girando con la última estimación
    lost_speed_factor: 0.7             # [0, 1] fracción de la velocidad de crucero sin carril (con 0,41 m/s son 0,29: por encima del piso donde el motor no movía el auto con las ruedas al tope)
    max_dt_s: 0.5                      # [s] una pausa mayor entre mediciones reinicia el PID [asumido]
    # Al perder el carril se sostiene el último giro con carril durante este tiempo y después
    # se endereza. En la grabación del 2026-11-08 el auto enderezaba en plena curva (la línea
    # salía de la vista y la confianza caía debajo de min_confidence) y se iba de la pista.
    # A 0,44 m/s, 0,5 s son 22 cm. 0 = enderezar enseguida (lo de antes).
    hold_steer_s: 0.5                  # [s] [asumido: afinar en pista]

    # Término de curvatura del PID: se suma curvature_ff_gain * atan(wheelbase_m * curvatura).
    # El PID solo miraba desvío y rumbo y se quedaba corto en las curvas (grabación 2026-11-08).
    # Con una línea la curvatura es ruido (desvío estándar 1,24 1/m contra 0,41 con dos), así
    # que solo se toma con dos líneas y se sostiene la última entre mediciones. 0 = sin término.
    curvature_ff_gain: 0.7             # [asumido: en el bag, 0,7 lleva la entrada de curva de 9° a ~25° y suma ~1° en recta]
    curvature_ff_min_confidence: 0.9   # [0, 1] dos líneas dan confianza 1, una sola 0,5
    curvature_ff_max: 2.2              # [1/m] centro de la curva más cerrada ~0,46 m (ver min_curve_radius_m de lane_detection)
    curvature_ff_hold_s: 0.5           # [s] [asumido]

    # Espera antes de doblar. El carril se mide a ~0,58 m delante del eje trasero y la curvatura
    # sale de toda la vista, así que el auto dobla antes de llegar a la curva. turn_delay_m retrasa
    # el término de curvatura turn_delay_m / cruise_speed_mps (5 cm a 0,3 m/s = 0,17 s): la curva
    # empieza más tarde y el giro de régimen queda igual. 0 = como antes.
    # Se cambian en vivo: ros2 param set /control turn_delay_m 0.10
    turn_delay_m: 0.05                 # [m] [asumido: probar 0, 0,05, 0,10, 0,15 en pista]
    # Evalúa el desvío y el rumbo esta distancia más cerca del auto. Además de adelantar menos,
    # baja el giro de régimen en la curva (~17 % con 5 cm), así que se prueba aparte. 0 = apagado.
    error_shift_m: 0.0                 # [m] [asumido]

    # Límite físico (informe 4.12.1): con el tope de 25° y wheelbase_m, R_min = L / tan(25°)
    # ~ 0,56 m. Si el carril pide una curva más cerrada (curvatura confiable > 1 / R_min), la
    # velocidad baja a esta fracción. 1 = apagado.
    infeasible_curve_speed_factor: 0.7     # (0, 1] [asumido]

    # Estado de giro (prueba 1: con una sola línea el detector cambiaba de lado a mitad de curva
    # y el giro objetivo pasaba de +25° a -16,5° en menos de un segundo). Si el rumbo del carril
    # se mantiene sobre curve_enter_heading_rad durante curve_enter_s, el control se acuerda de
    # que está en una curva: un giro al lado contrario se reemplaza por el último buen giro
    # (curve_hold_s) y después por 0, y al perder el carril se sostiene curve_lost_hold_s. Sale
    # con el rumbo bajo curve_exit_heading_rad durante curve_exit_s, o a los curve_max_s. Con el
    # rumbo del lado contrario curve_reverse_s es una curva en S y cambia de lado.
    # Se apaga en vivo con: ros2 param set /control curve_enter_heading_rad 0.0
    curve_enter_heading_rad: 0.25      # [rad] 14° [asumido: sale del video de la prueba 1]
    curve_enter_s: 0.15                # [s] [asumido]
    curve_exit_heading_rad: 0.10       # [rad] [asumido]
    curve_exit_s: 0.3                  # [s] [asumido]
    curve_reverse_s: 0.6               # [s] [asumido]
    curve_max_s: 5.0                   # [s] [asumido]
    curve_hold_s: 0.5                  # [s] [asumido]
    curve_lost_hold_s: 1.0             # [s] [asumido]
    # Con una sola línea, un rumbo del lado contrario menor a esto no tira del volante dentro de
    # una curva (parpadeo de lado, video del 2026-11-17); uno mayor es un pasarse de giro real y se obedece.
    curve_reject_heading_rad: 0.5      # [rad] [asumido]. 0 = apagado

    # Algoritmo de dirección (ADR-0004), cada uno en bfmc_control/algoritmos/: pid (A2-138, el
    # de siempre) o pure_pursuit (A2-155). El PID queda por defecto hasta validar Pure Pursuit
    # en pista. Se elige al lanzar (control_algorithm:=) o en el visor antes de conectar, y se
    # puede cambiar en vivo: ros2 param set /control algorithm pure_pursuit
    algorithm: pid

    # Pure Pursuit. Marco del auto: origen en el eje trasero, x adelante. La vista cenital
    # empieza a calib_forward_near_m (0,45 m) delante de la cámara: Ld tiene que caer dentro
    # de lo que la cámara ve (eje trasero -> cámara + 0,45 a 0,95 m), si no se extrapola a ciegas.
    wheelbase_m: 0.26                  # [m] distancia entre ejes, centro a centro de las ruedas [asumido: medir]
    camera_to_rear_axle_m: 0.20        # [m] del eje trasero al pie de la cámara, hacia adelante [asumido: medir]
    lookahead_min_m: 0.80              # [m] Ld mínima desde el eje trasero: la de recta [asumido: afinar en pista]
    lookahead_max_m: 1.10              # [m] Ld máxima [asumido]
    lookahead_gain_s: 0.0              # [s] Ld = gain * v; 0 = Ld fija en la mínima (arrancar así)
    # Ld en las curvas: baja de la de recta a lookahead_curve_m a medida que la curvatura llega
    # a lookahead_curve_kappa. La curva más cerrada (~0,46 m de radio) pide Ld menor que ese
    # radio; con Ld fija el auto corta camino. Más cerca que ~0,55 m (eje trasero -> cámara +
    # calib_forward_near_m) el punto queda antes de lo que la cámara ve. 0 = apagado.
    lookahead_curve_m: 0.55            # [m] [asumido: afinar en pista]
    lookahead_curve_kappa: 2.0         # [1/m] radio 0,5 m [asumido]
    # Velocidad: en las curvas, la que no supera esta aceleración lateral (v = sqrt(a / |curvatura|)),
    # y con poca confianza baja hasta speed_min_factor de la de crucero.
    max_lateral_accel_mps2: 1.0        # [m/s²] [asumido: afinar en pista]
    speed_min_factor: 0.5              # (0, 1]
