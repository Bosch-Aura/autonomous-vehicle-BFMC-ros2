# Parámetros de bfmc_hardware_bridge. Toda constante del nodo vive acá, no en el código.
# La clave de primer nivel es el nombre del nodo.
# Los valores marcados [asumido] o [por-verificar] se confirman en el auto.
# Los marcados [hardware.env] tienen que coincidir con Brain-Aura/hardware.env, que es de
# donde los toma el firmware de Bosch-Aura/embedded al compilar.
hardware_bridge:
  ros__parameters:
    # Enlace serial con el ESP32 (USB del DevKit).
    serial_port: /dev/ttyCH341USB0     # en la Jetson el driver de WCH expone el CH340 con este nombre, no como ttyUSB0
    baud_rate: 115200                  # baudios del USB en el firmware (Serial.begin en main.cpp)
    send_rate_hz: 20.0                 # [Hz] velocidad y dirección por ciclo; renueva el TTL de 200 ms y hace de heartbeat
    reconnect_period_s: 1.0            # [s] espera entre intentos de reabrir el puerto

    # Modo y armado del ESP32.
    esp32_mode: AUTO                   # AUTO: watchdog de 300 ms. MANUAL: 1000 ms, pensado para un operador
    arm_retry_s: 0.5                   # [s] espera entre intentos de armar mientras el ESP32 no confirme

    # Topics y servicios.
    cmd_topic: /cmd/drive              # comando final (ackermann_msgs/AckermannDriveStamped)
    safety_topic: /safety/status       # si indica emergencia, el puente frena
    status_topic: /hardware/status
    status_frame_id: base_link
    status_rate_hz: 2.0                # [Hz] frecuencia de /hardware/status
    arm_service: /hardware/arm         # std_srvs/Trigger: rearma el ESP32 después de un FAULT

    # Seguridad.
    link_timeout_s: 0.5                # [s] sin eventos del ESP32 más tiempo que esto, el enlace se da por caído [asumido]
    cmd_timeout_s: 0.25                # [s] un comando más viejo que esto se descarta y se frena [asumido]

    # Escalas de los comandos.
    max_speed_mps: 0.5                 # [m/s] velocidad que corresponde a duty_max [asumido: no hay calibración m/s -> duty]
    max_steer_rad: 0.436332            # [rad] 25 grados: ángulo que corresponde al tope del servo [hardware.env: BRAIN_STEER_MAX_GRADOS]
    duty_start: 140                    # duty mínimo con el que el motor arranca desde parado [hardware.env: BRAIN_DUTY_ARRANQUE]
    duty_max: 255                      # [hardware.env: BRAIN_DUTY_MAX]
    servo_left: 50                     # [hardware.env: BRAIN_SERVO_IZQUIERDA]
    servo_center: 105                  # [hardware.env: BRAIN_SERVO_CENTRO]
    servo_right: 160                   # [hardware.env: BRAIN_SERVO_DERECHA]
