# Parámetros de bfmc_hardware_bridge. Toda constante del nodo vive acá, no en el código.
# La clave de primer nivel es el nombre del nodo.
# Los valores marcados [asumido] o [por-verificar] se confirman en el auto.
# Los marcados [hardware.env] tienen que coincidir con Brain-Aura/hardware.env, que es de
# donde los toma el firmware de Bosch-Aura/embedded al compilar.
hardware_bridge:
  ros__parameters:
    # Enlace serial con el ESP32 (USB del DevKit).
    serial_port: /dev/esp32            # nombre fijo de la regla udev/99-bfmc-esp32.rules (el kernel lo llama ttyCH341USB0, ttyCH341USB1...)
    baud_rate: 115200                  # baudios del USB en el firmware (Serial.begin en main.cpp)
    send_rate_hz: 20.0                 # [Hz] velocidad y dirección por ciclo; alimentan el watchdog de 300 ms del ESP32
    reconnect_period_s: 1.0            # [s] espera entre intentos de reabrir el puerto

    # Armado del ESP32 (el firmware no tiene modos de manejo; su watchdog es de 300 ms).
    arm_retry_s: 0.5                   # [s] espera entre reintentos de armar, detener, arrancar o destrabar mientras el ESP32 no confirme
    heartbeat_period_s: 0.3            # [s] cada cuánto se reenvía el stop vigente para que el ESP32 conteste (latido) [asumido]

    # Topics y servicios.
    cmd_topic: /cmd/drive              # comando final (ackermann_msgs/AckermannDriveStamped)
    status_topic: /hardware/status
    status_frame_id: base_link
    status_rate_hz: 2.0                # [Hz] frecuencia de /hardware/status
    arm_service: /hardware/arm         # std_srvs/Trigger: rearma el ESP32 después de un FAULT
    stop_service: /hardware/stop       # std_srvs/SetBool: true detiene (STOPPED), false vuelve a arrancar
    obstacle_reset_service: /hardware/obstacle_reset  # std_srvs/Trigger: suelta a mano el bloqueo por obstáculo

    # Arranque.
    start_stopped: true                # el auto arranca detenido (SYS_STOP) hasta que se pida arrancar en /hardware/stop

    # Seguridad.
    link_timeout_s: 1.0                # [s] sin eventos del ESP32 más tiempo que esto, el enlace se da por caído; > heartbeat_period_s [asumido]
    cmd_timeout_s: 0.25                # [s] un comando más viejo que esto se descarta y se frena [asumido]

    # Obstáculos (ADR-0003). El ESP32 frena solo; sin nada al alcance del ultrasónico no suelta.
    auto_obstacle_reset: true          # con el auto frenado y el sensor en silencio (2 s sin lecturas), mandar M:OBSTACLE_RESET una vez
    obstacle_reblock_window_s: 3.0     # [s] si vuelve a frenar antes de esto tras un destrabe automático, no se insiste [asumido]

    # Escalas de los comandos.
    max_speed_mps: 0.5                 # [m/s] velocidad que corresponde a duty_max [asumido: no hay calibración m/s -> duty]
    max_steer_rad: 0.523599            # [rad] 30 grados: ángulo de las ruedas con el servo en un tope (servo_left o servo_right) [por-verificar: medir en el auto]
    duty_start: 140                    # duty mínimo con el que el motor arranca desde parado [hardware.env: BRAIN_DUTY_ARRANQUE]
    duty_max: 255                      # [hardware.env: BRAIN_DUTY_MAX]
    # En este auto el servo está montado al revés de lo que dice hardware.env: con 50 las ruedas
    # van a la DERECHA. Visto en pista (2026-11-08): pidiendo derecha, el auto se iba a la
    # izquierda. Por eso los topes van intercambiados respecto de BRAIN_SERVO_IZQUIERDA/DERECHA.
    servo_left: 160                    # [hardware.env: BRAIN_SERVO_DERECHA] tope que gira a la izquierda
    servo_center: 105                  # [hardware.env: BRAIN_SERVO_CENTRO]
    servo_right: 50                    # [hardware.env: BRAIN_SERVO_IZQUIERDA] tope que gira a la derecha
